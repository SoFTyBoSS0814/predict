<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>Cricket Match Predictor & Value Bet Finder</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
        .container { max-width: 1100px; margin: 0 auto; }
        h1 { text-align: center; color: #38bdf8; margin-bottom: 25px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .card { background: #1e293b; border-radius: 10px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .full-width { grid-column: 1 / -1; }
        h2 { color: #f1f5f9; border-bottom: 2px solid #334155; padding-bottom: 8px; margin-top: 0; }
        label { display: block; margin-top: 10px; color: #94a3b8; font-size: 0.9em; }
        input, select { width: 100%; padding: 10px; margin-top: 5px; background: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; background: #0284c7; color: white; border: none; padding: 12px; margin-top: 20px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: #0369a1; }
        .player-list { max-height: 200px; overflow-y: auto; margin-top: 10px; padding-right: 5px; }
        .player-row { display: flex; justify-content: space-between; align-items: center; background: #334155; padding: 6px 12px; margin-bottom: 6px; border-radius: 4px; font-size: 0.9em; }
        .result-box { display: flex; justify-content: space-around; text-align: center; margin-top: 15px; }
        .stat-card { background: #0f172a; padding: 15px; border-radius: 8px; width: 45%; }
        .stat-val { font-size: 2em; font-weight: bold; color: #38bdf8; }
        .value-tag { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 0.8em; font-weight: bold; }
        .value-yes { background: #166534; color: #4ade80; }
        .value-no { background: #991b1b; color: #fca5a5; }
    </style>
</head>
<body>

<div class="container">
    <h1>🏏 Cricket Match Predictor</h1>

    <div class="grid">
        <!-- MECCS BEÁLLÍTÁSOK -->
        <div class="card full-width">
            <h2>1. Meccs Beállítások & Venue</h2>
            <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px;">
                <div>
                    <label>Formátum</label>
                    <select id="matchFormat">
                        <option value="T20">T20 (20 Overs)</option>
                        <option value="ODI">ODI (50 Overs)</option>
                    </select>
                </div>
                <div>
                    <label>Helyszín (Venue Pitch Condition)</label>
                    <select id="venueCondition">
                        <option value="batting">Ütőbarát Pálya (High Scoring)</option>
                        <option value="balanced" selected>Kiegyensúlyozott (Balanced)</option>
                        <option value="bowling">Dobóbarát Pálya (Low Scoring)</option>
                    </select>
                </div>
                <div>
                    <label>Időjárás / Pálya Állapot</label>
                    <select id="weatherFactor">
                        <option value="normal">Átlagos / Tiszta idő</option>
                        <option value="overcast">Felhős (Kedvez a Swing dobóknak)</option>
                        <option value="dry">Száraz / Repedezett (Kedvez a Spin dobóknak)</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- CSAPAT A -->
        <div class="card">
            <h2>A Csapat (Hazai / Csapat 1)</h2>
            <label>Csapat Neve</label>
            <input type="text" id="teamAName" value="India">
            
            <label>Játékos Hozzáadása</label>
            <div style="display: flex; gap: 5px;">
                <input type="text" id="pAName" placeholder="Név">
                <input type="number" id="pARating" placeholder="Rating (1-100)" min="1" max="100" style="width: 100px;">
                <select id="pARole" style="width: 120px;">
                    <option value="bat">Ütő</option>
                    <option value="bowl">Dobó</option>
                </select>
                <button onclick="addPlayer('A')" style="margin-top: 5px; width: 60px;">+</button>
            </div>

            <div class="player-list" id="teamAList"></div>
        </div>

        <!-- CSAPAT B -->
        <div class="card">
            <h2>B Csapat (Vendég / Csapat 2)</h2>
            <label>Csapat Neve</label>
            <input type="text" id="teamBName" value="Australia">

            <label>Játékos Hozzáadása</label>
            <div style="display: flex; gap: 5px;">
                <input type="text" id="pBName" placeholder="Név">
                <input type="number" id="pBRating" placeholder="Rating (1-100)" min="1" max="100" style="width: 100px;">
                <select id="pBRole" style="width: 120px;">
                    <option value="bat">Ütő</option>
                    <option value="bowl">Dobó</option>
                </select>
                <button onclick="addPlayer('B')" style="margin-top: 5px; width: 60px;">+</button>
            </div>

            <div class="player-list" id="teamBList"></div>
        </div>

        <!-- PREDICTION & VALUE BET -->
        <div class="card full-width">
            <h2>2. Elemzés & Becslés Futtatása</h2>
            <button onclick="predictMatch()">BECSLÉS GENERÁLÁSA 📊</button>

            <div class="result-box" id="results" style="display:none; margin-top: 25px;">
                <div class="stat-card">
                    <h3 id="resTeamAName">A Csapat</h3>
                    <div class="stat-val" id="probA">50%</div>
                    <div>Győzelmi Esély</div>
                    <div style="margin-top: 10px;">Várható Futás: <b id="runsA">0</b></div>
                    
                    <div style="margin-top: 15px; border-top: 1px solid #334155; padding-top: 10px;">
                        <label>Bukméker Odds:</label>
                        <input type="number" step="0.01" id="oddsA" placeholder="pl. 1.85" oninput="checkValueBet()">
                        <div id="valueA" style="margin-top: 8px;"></div>
                    </div>
                </div>

                <div class="stat-card">
                    <h3 id="resTeamBName">B Csapat</h3>
                    <div class="stat-val" id="probB">50%</div>
                    <div>Győzelmi Esély</div>
                    <div style="margin-top: 10px;">Várható Futás: <b id="runsB">0</b></div>

                    <div style="margin-top: 15px; border-top: 1px solid #334155; padding-top: 10px;">
                        <label>Bukméker Odds:</label>
                        <input type="number" step="0.01" id="oddsB" placeholder="pl. 2.10" oninput="checkValueBet()">
                        <div id="valueB" style="margin-top: 8px;"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const teams = {
        A: [
            { name: "Rohit Sharma", rating: 88, role: "bat" },
            { name: "Virat Kohli", rating: 92, role: "bat" },
            { name: "Jasprit Bumrah", rating: 94, role: "bowl" }
        ],
        B: [
            { name: "Travis Head", rating: 86, role: "bat" },
            { name: "Steve Smith", rating: 89, role: "bat" },
            { name: "Pat Cummins", rating: 91, role: "bowl" }
        ]
    };

    function renderPlayers() {
        ['A', 'B'].forEach(t => {
            const listEl = document.getElementById(`team${t}List`);
            listEl.innerHTML = '';
            teams[t].forEach((p, i) => {
                listEl.innerHTML += `
                    <div class="player-row">
                        <span><b>${p.name}</b> (${p.role === 'bat' ? 'Ütő' : 'Dobó'})</span>
                        <span>Rating: ${p.rating} <button onclick="removePlayer('${t}', ${i})" style="margin:0; padding: 2px 6px; width:auto; background:#ef4444;">x</button></span>
                    </div>
                `;
            });
        });
    }

    function addPlayer(team) {
        const name = document.getElementById(`p${team}Name`).value;
        const rating = parseInt(document.getElementById(`p${team}Rating`).value);
        const role = document.getElementById(`p${team}Role`).value;

        if (name && rating) {
            teams[team].push({ name, rating, role });
            document.getElementById(`p${team}Name`).value = '';
            document.getElementById(`p${team}Rating`).value = '';
            renderPlayers();
        }
    }

    function removePlayer(team, index) {
        teams[team].splice(index, 1);
        renderPlayers();
    }

    let currentProbA = 0;
    let currentProbB = 0;

    function predictMatch() {
        if (teams.A.length === 0 || teams.B.length === 0) {
            alert("Mindkét csapatba vegyél fel legalább 1 játékost!");
            return;
        }

        const format = document.getElementById('matchFormat').value;
        const venue = document.getElementById('venueCondition').value;
        const weather = document.getElementById('weatherFactor').value;

        // Csapat átlag ratingek kiszámítása
        const getStats = (teamList) => {
            const bats = teamList.filter(p => p.role === 'bat');
            const bowls = teamList.filter(p => p.role === 'bowl');
            
            const avgBat = bats.length ? bats.reduce((a, b) => a + b.rating, 0) / bats.length : 70;
            const avgBowl = bowls.length ? bowls.reduce((a, b) => a + b.rating, 0) / bowls.length : 70;
            return { avgBat, avgBowl };
        };

        const statsA = getStats(teams.A);
        const statsB = getStats(teams.B);

        // Helyszíni és időjárási szorzók
        let venueBatMod = 1.0;
        let venueBowlMod = 1.0;
        if (venue === 'batting') venueBatMod = 1.15;
        if (venue === 'bowling') venueBowlMod = 1.15;
        if (weather === 'overcast') venueBowlMod *= 1.1;

        // Csapat Erősségi Pontszámok (A támadása B védekezése ellen)
        const powerA = (statsA.avgBat * venueBatMod) - (statsB.avgBowl * venueBowlMod);
        const powerB = (statsB.avgBat * venueBatMod) - (statsA.avgBowl * venueBowlMod);

        // Esélyek kiszámítása (Logistic/Softmax jellegű)
        const diff = powerA - powerB;
        currentProbA = Math.round(1 / (1 + Math.pow(10, -diff / 40)) * 100);
        currentProbB = 100 - currentProbA;

        // Várható futások
        const baseRuns = format === 'T20' ? 160 : 270;
        const runsA = Math.round(baseRuns + (powerA * 1.2));
        const runsB = Math.round(baseRuns + (powerB * 1.2));

        // Kiíratás
        document.getElementById('resTeamAName').innerText = document.getElementById('teamAName').value;
        document.getElementById('resTeamBName').innerText = document.getElementById('teamBName').value;
        document.getElementById('probA').innerText = `${currentProbA}%`;
        document.getElementById('probB').innerText = `${currentProbB}%`;
        document.getElementById('runsA').innerText = runsA;
        document.getElementById('runsB').innerText = runsB;

        document.getElementById('results').style.display = 'flex';
        checkValueBet();
    }

    function checkValueBet() {
        const oddsA = parseFloat(document.getElementById('oddsA').value);
        const oddsB = parseFloat(document.getElementById('oddsB').value);

        if (oddsA && currentProbA) {
            const impliedProbA = (1 / oddsA) * 100;
            const marginA = currentProbA - impliedProbA;
            const elA = document.getElementById('valueA');
            if (marginA > 3) {
                elA.innerHTML = `<span class="value-tag value-yes">VALUE BET (+${marginA.toFixed(1)}%)</span>`;
            } else {
                elA.innerHTML = `<span class="value-tag value-no">Nincs Érték</span>`;
            }
        }

        if (oddsB && currentProbB) {
            const impliedProbB = (1 / oddsB) * 100;
            const marginB = currentProbB - impliedProbB;
            const elB = document.getElementById('valueB');
            if (marginB > 3) {
                elB.innerHTML = `<span class="value-tag value-yes">VALUE BET (+${marginB.toFixed(1)}%)</span>`;
            } else {
                elB.innerHTML = `<span class="value-tag value-no">Nincs Érték</span>`;
            }
        }
    }

    // Inicializálás
    renderPlayers();
</script>
</body>
</html>
