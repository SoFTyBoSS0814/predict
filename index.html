<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>Cricket Match Predictor - Database Edition</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { text-align: center; color: #38bdf8; margin-bottom: 25px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .card { background: #1e293b; border-radius: 10px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .full-width { grid-column: 1 / -1; }
        h2 { color: #f1f5f9; border-bottom: 2px solid #334155; padding-bottom: 8px; margin-top: 0; }
        label { display: block; margin-top: 10px; color: #94a3b8; font-size: 0.9em; }
        input, select { width: 100%; padding: 10px; margin-top: 5px; background: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; background: #0284c7; color: white; border: none; padding: 12px; margin-top: 20px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: #0369a1; }
        .btn-add { margin-top: 5px; background: #10b981; }
        .btn-add:hover { background: #059669; }
        .player-list { max-height: 280px; overflow-y: auto; margin-top: 10px; padding-right: 5px; }
        .player-row { display: flex; justify-content: space-between; align-items: center; background: #334155; padding: 6px 12px; margin-bottom: 6px; border-radius: 4px; font-size: 0.85em; }
        .btn-del { margin: 0; padding: 2px 8px; width: auto; background: #ef4444; border-radius: 4px; cursor: pointer; }
        .btn-del:hover { background: #dc2626; }
        .result-box { display: flex; justify-content: space-around; text-align: center; margin-top: 15px; }
        .stat-card { background: #0f172a; padding: 15px; border-radius: 8px; width: 45%; }
        .stat-val { font-size: 2em; font-weight: bold; color: #38bdf8; }
        .value-tag { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 0.8em; font-weight: bold; }
        .value-yes { background: #166534; color: #4ade80; }
        .value-no { background: #991b1b; color: #fca5a5; }
        .venue-info { background: #0f172a; padding: 10px; border-radius: 6px; margin-top: 10px; font-size: 0.85em; color: #38bdf8; border-left: 3px solid #38bdf8; }
    </style>
</head>
<body>

<div class="container">
    <h1>🏏 Krikett Meccs Becslő & Adatbázis</h1>

    <div class="grid">
        <!-- MECCS & HELYSZÍN -->
        <div class="card full-width">
            <h2>1. Meccs & Helyszín Kereső</h2>
            <div style="display: grid; grid-template-columns: 1fr 2fr 1fr; gap: 15px;">
                <div>
                    <label>Formátum</label>
                    <select id="matchFormat">
                        <option value="T20">T20 (20 Overs)</option>
                        <option value="ODI">ODI (50 Overs)</option>
                    </select>
                </div>
                <div>
                    <label>Stadion / Venue Kereső (Írd be a nevet)</label>
                    <input type="text" id="venueSearch" list="venueOptions" placeholder="pl. Kensington Oval, Lord's..." oninput="onVenueSelect()">
                    <datalist id="venueOptions"></datalist>
                </div>
                <div>
                    <label>Időjárás / Pálya Állapot</label>
                    <select id="weatherFactor">
                        <option value="normal">Átlagos / Tiszta idő</option>
                        <option value="overcast">Felhős (Swing dobóknak kedvez)</option>
                        <option value="dry">Száraz / Repedezett (Spin dobóknak kedvez)</option>
                    </select>
                </div>
            </div>
            <div id="venueDescription" class="venue-info">
                Pálya adatai betöltve...
            </div>
        </div>

        <!-- CSAPAT A -->
        <div class="card">
            <h2>A Csapat (Hazai)</h2>
            <label>Válassz Csapatot az Adatbázisból</label>
            <select id="teamASelect" onchange="loadTeamFromDB('A')">
                <option value="india">India</option>
                <option value="australia">Australia</option>
                <option value="england">England</option>
                <option value="pakistan">Pakistan</option>
            </select>

            <label style="margin-top: 15px;">Játékos hozzáadása / cseréje (opcionális)</label>
            <div style="display: flex; gap: 5px;">
                <input type="text" id="pAName" placeholder="Név">
                <input type="number" id="pARating" placeholder="Rating (1-100)" min="1" max="100" style="width: 90px;">
                <select id="pARole" style="width: 100px;">
                    <option value="bat">Ütő</option>
                    <option value="bowl">Dobó</option>
                    <option value="all">Mindenes</option>
                </select>
                <button onclick="addPlayer('A')" class="btn-add" style="width: 50px;">+</button>
            </div>

            <div class="player-list" id="teamAList"></div>
        </div>

        <!-- CSAPAT B -->
        <div class="card">
            <h2>B Csapat (Vendég)</h2>
            <label>Válassz Csapatot az Adatbázisból</label>
            <select id="teamBSelect" onchange="loadTeamFromDB('B')">
                <option value="india">India</option>
                <option value="australia" selected>Australia</option>
                <option value="england">England</option>
                <option value="pakistan">Pakistan</option>
            </select>

            <label style="margin-top: 15px;">Játékos hozzáadása / cseréje (opcionális)</label>
            <div style="display: flex; gap: 5px;">
                <input type="text" id="pBName" placeholder="Név">
                <input type="number" id="pBRating" placeholder="Rating (1-100)" min="1" max="100" style="width: 90px;">
                <select id="pBRole" style="width: 100px;">
                    <option value="bat">Ütő</option>
                    <option value="bowl">Dobó</option>
                    <option value="all">Mindenes</option>
                </select>
                <button onclick="addPlayer('B')" class="btn-add" style="width: 50px;">+</button>
            </div>

            <div class="player-list" id="teamBList"></div>
        </div>

        <!-- PREDICTION & VALUE BET -->
        <div class="card full-width">
            <h2>2. Elemzés & Sportfogadási Érték (Value Bet)</h2>
            <button onclick="predictMatch()">BECSLÉS GENERÁLÁSA 📊</button>

            <div class="result-box" id="results" style="display:none; margin-top: 25px;">
                <div class="stat-card">
                    <h3 id="resTeamAName">A Csapat</h3>
                    <div class="stat-val" id="probA">50%</div>
                    <div>Győzelmi Esély</div>
                    <div style="margin-top: 10px;">Várható Futás: <b id="runsA">0</b></div>
                    
                    <div style="margin-top: 15px; border-top: 1px solid #334155; padding-top: 10px;">
                        <label>Bukméker Odds (pl. 1.85):</label>
                        <input type="number" step="0.01" id="oddsA" placeholder="pl. 1.85" oninput="checkValueBet()">
                        <div id="valueA" style="margin-top: 8px;"></div>
                    </div>
                </div>

                <div class="stat-card">
                    <h3 id="resTeamBName">B Csapat</h3>
                    <div class="stat-val" id="probB">50%</div>
                    <div>Győzelmi Esély</div>
                    <div style="margin-top: 10px;">Várható Futás: <b id="runsB">0</b></div>

                    <div style="margin-top: 15px; border-top: 1px solid #334155; padding-top: 10px;">
                        <label>Bukméker Odds (pl. 2.10):</label>
                        <input type="number" step="0.01" id="oddsB" placeholder="pl. 2.10" oninput="checkValueBet()">
                        <div id="valueB" style="margin-top: 8px;"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // 1. HELYSZÍNEK ADATBÁZISA
    const venueDatabase = [
        { name: "Kensington Oval (Bridgetown, Barbados)", batMod: 1.02, bowlMod: 1.05, desc: "Klasszikus karibi pálya. Új labdával a dobók érvényesülnek, de a stabil ütés magas pontszámot eredményez." },
        { name: "Melbourne Cricket Ground (MCG, Ausztrália)", batMod: 1.12, bowlMod: 0.95, desc: "Hatalmas outfield, kifejezetten kedvez az ütőknek (High-scoring venue)." },
        { name: "Wankhede Stadium (Mumbai, India)", batMod: 1.18, bowlMod: 0.90, desc: "Rövid határok, kiváló ütőpálya, esti harmatfaktorral." },
        { name: "Lord's Cricket Ground (London, Anglia)", batMod: 0.92, bowlMod: 1.15, desc: "A 'Krikett Otthona'. Jellegzetes lejtése a gyors/swing dobóknak kedvez." },
        { name: "Dubai International Stadium (UAE)", batMod: 1.00, bowlMod: 1.02, desc: "Lassabb pálya, a meccs második felében a spin-dobók dominálnak." }
    ];

    // 2. CSAPATOK ÉS 11 FŐS KERETEK ADATBÁZISA (Hivatalos statisztikák alapján)
    const teamsDatabase = {
        india: {
            name: "India",
            players: [
                { name: "Rohit Sharma", rating: 89, role: "bat" },
                { name: "Virat Kohli", rating: 93, role: "bat" },
                { name: "Suryakumar Yadav", rating: 91, role: "bat" },
                { name: "Yashasvi Jaiswal", rating: 87, role: "bat" },
                { name: "Rishabh Pant", rating: 88, role: "bat" },
                { name: "Hardik Pandya", rating: 88, role: "all" },
                { name: "Ravindra Jadeja", rating: 87, role: "all" },
                { name: "Jasprit Bumrah", rating: 95, role: "bowl" },
                { name: "Kuldeep Yadav", rating: 88, role: "bowl" },
                { name: "Arshdeep Singh", rating: 85, role: "bowl" },
                { name: "Mohammed Siraj", rating: 86, role: "bowl" }
            ]
        },
        australia: {
            name: "Australia",
            players: [
                { name: "Travis Head", rating: 90, role: "bat" },
                { name: "David Warner", rating: 88, role: "bat" },
                { name: "Mitchell Marsh", rating: 86, role: "all" },
                { name: "Steve Smith", rating: 89, role: "bat" },
                { name: "Glenn Maxwell", rating: 87, role: "all" },
                { name: "Marcus Stoinis", rating: 85, role: "all" },
                { name: "Matthew Wade", rating: 84, role: "bat" },
                { name: "Pat Cummins", rating: 92, role: "bowl" },
                { name: "Mitchell Starc", rating: 91, role: "bowl" },
                { name: "Adam Zampa", rating: 89, role: "bowl" },
                { name: "Josh Hazlewood", rating: 90, role: "bowl" }
            ]
        },
        england: {
            name: "England",
            players: [
                { name: "Jos Buttler", rating: 91, role: "bat" },
                { name: "Phil Salt", rating: 89, role: "bat" },
                { name: "Will Jacks", rating: 85, role: "bat" },
                { name: "Harry Brook", rating: 88, role: "bat" },
                { name: "Liam Livingstone", rating: 86, role: "all" },
                { name: "Moeen Ali", rating: 84, role: "all" },
                { name: "Sam Curran", rating: 86, role: "all" },
                { name: "Adil Rashid", rating: 90, role: "bowl" },
                { name: "Jofra Archer", rating: 91, role: "bowl" },
                { name: "Mark Wood", rating: 88, role: "bowl" },
                { name: "Reece Topley", rating: 84, role: "bowl" }
            ]
        },
        pakistan: {
            name: "Pakistan",
            players: [
                { name: "Babar Azam", rating: 90, role: "bat" },
                { name: "Mohammad Rizwan", rating: 89, role: "bat" },
                { name: "Fakhar Zaman", rating: 85, role: "bat" },
                { name: "Usman Khan", rating: 81, role: "bat" },
                { name: "Iftikhar Ahmed", rating: 83, role: "all" },
                { name: "Imad Wasim", rating: 84, role: "all" },
                { name: "Shadab Khan", rating: 85, role: "all" },
                { name: "Shaheen Afridi", rating: 92, role: "bowl" },
                { name: "Naseem Shah", rating: 88, role: "bowl" },
                { name: "Haris Rauf", rating: 87, role: "bowl" },
                { name: "Mohammad Amir", rating: 86, role: "bowl" }
            ]
        }
    };

    // Aktuális aktív keretek a memóriában
    let activeTeams = {
        A: [],
        B: []
    };

    let selectedVenue = venueDatabase[0];

    function initApp() {
        // Venue datalist feltöltése
        const datalist = document.getElementById('venueOptions');
        datalist.innerHTML = '';
        venueDatabase.forEach(v => {
            datalist.innerHTML += `<option value="${v.name}">`;
        });
        document.getElementById('venueSearch').value = venueDatabase[0].name;
        onVenueSelect();

        // Kezdeti csapatok betöltése az adatbázisból
        loadTeamFromDB('A');
        loadTeamFromDB('B');
    }

    function onVenueSelect() {
        const val = document.getElementById('venueSearch').value;
        const match = venueDatabase.find(v => v.name.toLowerCase() === val.toLowerCase());
        if (match) {
            selectedVenue = match;
            document.getElementById('venueDescription').innerText = `Pálya adatai: ${match.desc}`;
        } else {
            selectedVenue = { name: val, batMod: 1.0, bowlMod: 1.0, desc: "Egyéni pálya - Átlagos feltételek." };
            document.getElementById('venueDescription').innerText = "Egyéni pálya feltételezve (Standard feltételek).";
        }
    }

    function loadTeamFromDB(side) {
        const selectId = side === 'A' ? 'teamASelect' : 'teamBSelect';
        const teamKey = document.getElementById(selectId).value;
        const dbTeam = teamsDatabase[teamKey];

        // Mélymásolat, hogy a szerkesztés ne rontsa el az eredeti adatbázist
        activeTeams[side] = JSON.parse(JSON.stringify(dbTeam.players));
        renderPlayers(side);
    }

    function renderPlayers(side) {
        const listEl = document.getElementById(`team${side}List`);
        listEl.innerHTML = '';

        activeTeams[side].forEach((p, i) => {
            let roleTxt = p.role === 'bat' ? 'Ütő' : (p.role === 'bowl' ? 'Dobó' : 'Mindenes');
            listEl.innerHTML += `
                <div class="player-row">
                    <span><b>${p.name}</b> (${roleTxt})</span>
                    <span>Rating: ${p.rating} <button onclick="removePlayer('${side}', ${i})" class="btn-del">x</button></span>
                </div>
            `;
        });
    }

    function addPlayer(side) {
        const nameInput = document.getElementById(`p${side}Name`);
        const ratingInput = document.getElementById(`p${side}Rating`);
        const roleInput = document.getElementById(`p${side}Role`);

        const name = nameInput.value.trim();
        const rating = parseInt(ratingInput.value);
        const role = roleInput.value;

        if (name && !isNaN(rating)) {
            activeTeams[side].push({ name, rating, role });
            nameInput.value = '';
            ratingInput.value = '';
            renderPlayers(side);
        } else {
            alert("Kérlek add meg a játékos nevét és egy érvényes rating számot!");
        }
    }

    function removePlayer(side, index) {
        activeTeams[side].splice(index, 1);
        renderPlayers(side);
    }

    let currentProbA = 0;
    let currentProbB = 0;

    function predictMatch() {
        if (activeTeams.A.length === 0 || activeTeams.B.length === 0) {
            alert("Mindkét csapatba szükséges legalább 1 játékos!");
            return;
        }

        const format = document.getElementById('matchFormat').value;
        const weather = document.getElementById('weatherFactor').value;

        const teamAKey = document.getElementById('teamASelect').value;
        const teamBKey = document.getElementById('teamBSelect').value;

        const nameA = teamsDatabase[teamAKey].name;
        const nameB = teamsDatabase[teamBKey].name;

        document.getElementById('resTeamAName').innerText = nameA;
        document.getElementById('resTeamBName').innerText = nameB;

        const getStats = (list) => {
            const bats = list.filter(p => p.role === 'bat' || p.role === 'all');
            const bowls = list.filter(p => p.role === 'bowl' || p.role === 'all');

            const avgBat = bats.length ? bats.reduce((a, b) => a + b.rating, 0) / bats.length : 70;
            const avgBowl = bowls.length ? bowls.reduce((a, b) => a + b.rating, 0) / bowls.length : 70;
            return { avgBat, avgBowl };
        };

        const statsA = getStats(activeTeams.A);
        const statsB = getStats(activeTeams.B);

        let weatherBowlMod = 1.0;
        if (weather === 'overcast') weatherBowlMod = 1.08;
        if (weather === 'dry') weatherBowlMod = 1.05;

        const totalBatMod = selectedVenue.batMod;
        const totalBowlMod = selectedVenue.bowlMod * weatherBowlMod;

        const powerA = (statsA.avgBat * totalBatMod) - (statsB.avgBowl * totalBowlMod);
        const powerB = (statsB.avgBat * totalBatMod) - (statsA.avgBowl * totalBowlMod);

        const diff = powerA - powerB;
        currentProbA = Math.round(1 / (1 + Math.pow(10, -diff / 30)) * 100);
        currentProbB = 100 - currentProbA;

        const baseRuns = format === 'T20' ? 165 : 275;
        const runsA = Math.round(baseRuns + (powerA * 1.4));
        const runsB = Math.round(baseRuns + (powerB * 1.4));

        document.getElementById('probA').innerText = `${currentProbA}%`;
        document.getElementById('probB').innerText = `${currentProbB}%`;
        document.getElementById('runsA').innerText = runsA;
        document.getElementById('runsB').innerText = runsB;

        document.getElementById('results').style.display = 'flex';
        checkValueBet();
    }

    function checkValueBet() {
        const oddsA = parseFloat(document.getElementById('oddsA').value);
        const oddsB = parseFloat(document.getElementById('oddsB').value);

        if (!isNaN(oddsA) && currentProbA) {
            const impliedProbA = (1 / oddsA) * 100;
            const marginA = currentProbA - impliedProbA;
            const elA = document.getElementById('valueA');
            if (marginA > 2.5) {
                elA.innerHTML = `<span class="value-tag value-yes">VALUE BET (+${marginA.toFixed(1)}%)</span>`;
            } else {
                elA.innerHTML = `<span class="value-tag value-no">Nincs Érték</span>`;
            }
        } else {
            document.getElementById('valueA').innerHTML = '';
        }

        if (!isNaN(oddsB) && currentProbB) {
            const impliedProbB = (1 / oddsB) * 100;
            const marginB = currentProbB - impliedProbB;
            const elB = document.getElementById('valueB');
            if (marginB > 2.5) {
                elB.innerHTML = `<span class="value-tag value-yes">VALUE BET (+${marginB.toFixed(1)}%)</span>`;
            } else {
                elB.innerHTML = `<span class="value-tag value-no">Nincs Érték</span>`;
            }
        } else {
            document.getElementById('valueB').innerHTML = '';
        }
    }

    // Oldal betöltésekor indítunk
    window.onload = initApp;
</script>
</body>
</html>
